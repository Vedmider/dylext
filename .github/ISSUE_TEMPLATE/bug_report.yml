name: Bug report
description: Something is wrong or produces an incorrect result
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you observe, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Exact MCP tool call(s) or commands, plus the repo/fixture used.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
    validations:
      required: false
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, Java version, Postgres/pgvector version, parser sidecars (if any).
