name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: Java — unit, component & integration tests
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Testcontainers pulls service images (pgvector) from Docker Hub; authenticating avoids the
      # anonymous pull-rate-limit on shared runner IPs. Skipped automatically if the secret is unset.
      - name: Log in to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # Surefire (unit + component) + failsafe (Testcontainers integration, *IT).
      - name: Build, unit + component + integration tests
        run: mvn -B -ntp clean verify

  parser-go:
    name: Go parser sidecar
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: parsers/go
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: false
      - name: gofmt (must be clean)
        run: test -z "$(gofmt -l .)" || { echo 'gofmt needed on:'; gofmt -l .; exit 1; }
      - name: Test
        run: go test ./...

  parser-ts:
    name: TypeScript parser sidecar
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: parsers/ts
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - run: npm ci
      - run: npm test

  python-e2e:
    name: Python harness — syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The e2e/probe harnesses need a live stack to run; CI only guards their syntax.
      - name: Compile-check harness scripts
        run: python -m compileall -q e2e
