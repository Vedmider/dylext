spring:
  application:
    name: dylext
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dylext}
    username: ${DB_USERNAME:dylext}
    password: ${DB_PASSWORD:dylext}
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true

dylext:
  freshness:
    on-read: ${FRESHNESS_ON_READ:true}            # auto-sync a repo if git HEAD moved before a static read
  epoch:
    enabled: ${EPOCH_ENABLED:true}                # tag repo-scoped responses with (repo, commit) epoch
  cache:
    enabled: ${CACHE_ENABLED:false}               # response cache for deterministic reads, keyed by (tool, args, epoch)
    max-entries: ${CACHE_MAX_ENTRIES:2000}


logging:
  pattern:
    level: "%5p [trace=%X{traceId:-} req=%X{requestId:-}]"   # cross-service correlation on every log line
