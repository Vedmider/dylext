spring:
  application:
    name: dylext
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dylext}
    username: ${DB_USERNAME:dylext}
    password: ${DB_PASSWORD:dylext}
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

dylext:
  federation:
    rag-url: ${RAG_URL:http://localhost:18080}   # Sestacon: conceptual/doc retrieval (explain)
    cm-url: ${CM_URL:http://localhost:8080}       # code-memory: fuzzy graph-ranked code recall (recall)
  freshness:
    on-read: ${FRESHNESS_ON_READ:true}            # auto-sync a repo if git HEAD moved before a static read
