# Local stack: pgvector + the dylext app (web mode). Data is ephemeral.
services:
  pg:
    image: ${PGVECTOR_IMAGE:-pgvector/pgvector:pg16}
    environment:
      POSTGRES_DB: dylext
      POSTGRES_USER: dylext
      POSTGRES_PASSWORD: dylext
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dylext"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    image: ${APP_IMAGE:-dylext:0.1.0}
    depends_on:
      pg:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://pg:5432/dylext
      DB_USERNAME: dylext
      DB_PASSWORD: dylext
      # Composed mode: point federation at a running Sestacon (docs) + code-memory.
      # Default assumes those run on the host; override for other topologies.
      RAG_URL: ${RAG_URL:-http://host.docker.internal:18080}
      CM_URL: ${CM_URL:-http://host.docker.internal:8080}
      # Lego parsers: enabling a language = one env line pointing at its sidecar. No app change.
      DYLEXT_PARSERS_PYTHON: http://python-parser:9091
      DYLEXT_PARSERS_GO: http://go-parser:9092
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${APP_PORT:-8080}:8080"
    # Mount a repo read-only to index it from inside the container:
    #   REPO_MOUNT=/path/to/repo docker compose up
    volumes:
      - ${REPO_MOUNT:-./}:/workspace:ro

  python-parser:
    build:
      context: ./parsers/python
      args:
        REGISTRY: ${REGISTRY:-docker.io/library}
    image: ${PY_PARSER_IMAGE:-dylext-python-parser:0.1.0}

  go-parser:
    build:
      context: ./parsers/go
      args:
        REGISTRY: ${REGISTRY:-docker.io/library}
    image: ${GO_PARSER_IMAGE:-dylext-go-parser:0.1.0}
